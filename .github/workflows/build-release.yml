name: Build APK and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Determine next tag
        id: tag
        run: |
          TAGS=$(git tag --list)
          if echo "$TAGS" | grep -qx "1.0" || [ -n "$(echo "$TAGS" | grep -E '^[0-9]+$')" ]; then
            LAST_NUM=$(echo "$TAGS" | grep -E '^[0-9]+$' | sort -n | tail -n 1)
            if [ -z "$LAST_NUM" ]; then
              NEXT=2
            else
              NEXT=$((LAST_NUM + 1))
            fi
            echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          else
            echo "tag=1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK for release
        id: rename
        run: |
          OUT="ks-led-controller-${{ steps.tag.outputs.tag }}.apk"
          cp "${{ steps.apk.outputs.path }}" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: ${{ steps.rename.outputs.file }}
